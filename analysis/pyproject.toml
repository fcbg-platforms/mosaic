[project]
name = "mosaic-analysis"
version = "0.1.0"
description = "Post-recording batch pose/motion analysis for MOSAIC sessions (YOLOv8-pose)"
# py-feat>=2.1.0 (below) itself requires >=3.11 — the floor used to be a
# stale >=3.10, which was the direct cause of `uv sync`/`uv lock` resolver
# conflicts this project hit more than once (had to fall back to manual
# `uv pip install py-feat` instead of a clean sync). No `analysis/uv.lock`
# existed until this floor was fixed to match reality.
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    # >=8.3 is a real floor, not a note: model.track() is now on the Pose hot
    # path, and older 8.x appended a fresh tracker callback on every track()
    # call rather than replacing it, so a long session grew that list once per
    # frame. The Pose plugin's depth-estimation option (yolo26n/s/m-depth.pt,
    # see analysis/pose/depth_estimator.py) separately needs a recent-enough
    # release to ship the "depth" task at all; a fresh `uv sync` resolves to
    # the latest release either way.
    "ultralytics>=8.3",
    # ultralytics' tracker (Pose uses model.track()) needs lap but does not
    # declare it: it pip-installs it on first use, and every `uv sync` then
    # removed it again. Declared so it is locked and always present.
    "lap>=0.5.12",
    "mediapipe>=0.10.14",
    "pandas>=2.0",
    "scipy>=1.11",
    "h5py>=3.9",
    "matplotlib>=3.7",
    "faster-whisper>=1.0",
    "pyannote.audio>=3.1",
    "onnxruntime>=1.17",
    "py-feat>=2.1.0",
    # Praat bindings, for the spectrogram / pitch / intensity pass behind the
    # Speaker Diarization plugin's acoustic view. 0.4.7 is the first release
    # with a cp312 Windows wheel; earlier ones stop at cp311 and would fall
    # back to building Praat's C sources from scratch.
    "praat-parselmouth>=0.4.7",
    # Writing the spectrogram as an 8-bit greyscale PNG. Already present
    # transitively via matplotlib; declared because this code imports it
    # directly and should not depend on another package's dependency.
    "pillow>=10.0",
    # Already pulled in by ultralytics and pyannote.audio; listed here so the
    # CUDA index in [tool.uv.sources] below applies to them (uv only applies a
    # source to a direct dependency).
    "torch>=2.4",
    "torchvision>=0.19",
    "torchaudio>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

# onnxruntime (FER+ facial-expression backend) is deliberately the plain CPU
# package, not onnxruntime-gpu — the emotion-ferplus model is a tiny 64x64
# grayscale-input CNN, fast enough on CPU that a GPU variant isn't worth the
# extra CUDA-wheel complexity already noted below for the torch-based deps.
#
# py-feat (3rd facial-expression backend, Detectorv1) pulls in torch/
# torchvision (already present transitively via ultralytics/pyannote.audio,
# so not a new *class* of dependency) plus torchcodec, which is imported
# unconditionally at `import feat` time and needs a torchcodec-compatible
# system FFmpeg discoverable on PATH at runtime — unrelated to and separate
# from this project's own vcpkg-managed C++-side FFmpeg. If the pyfeat
# backend fails to construct, check `where ffmpeg` first; the failure
# surfaces as an FFmpeg-discovery RuntimeError from torchcodec, not a plain
# ImportError. py-feat also caches its downloaded model weights into its
# own installed package directory (site-packages/feat/resources) rather
# than a project-local models/ dir — unlike the other 2 expression
# backends, there is nothing to add to .gitignore for this one, and the
# cache location cannot be redirected via HF_HOME/HUGGINGFACE_HUB_CACHE
# (py-feat hardcodes its own cache_dir on every download).
#
# GPU acceleration (NVIDIA): torch, torchvision and torchaudio come from
# PyTorch's CUDA 13.0 index on Windows and Linux, so ultralytics (Pose, depth,
# YOLO face/segmentation) and pyannote.audio (diarization) run on the GPU when
# there is one, and on the CPU otherwise (the CUDA wheels work without a GPU,
# they are just larger). PyPI's own wheels are CPU-only, and a manual
# `uv pip install torch --index-url ...` would not survive the next `uv sync`,
# which reconciles back to uv.lock. cu130 needs an NVIDIA driver from the 580
# series or later; it is the CUDA build PyTorch publishes for every one of
# these three packages at the locked versions (see
# https://docs.astral.sh/uv/guides/integration/pytorch/). To change it, edit
# the index URL and run `uv lock`.
#
# faster-whisper (transcription) does not use torch: its ctranslate2 backend
# needs its own CUDA 12 cuBLAS (and, on Linux, cuDNN 9; the Windows wheel
# bundles cuDNN), which these wheels do not include.
# diarize.pipeline.resolve_whisper_device() runs it on the GPU only when
# those libraries load, and on the CPU otherwise.

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
