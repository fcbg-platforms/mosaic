[project]
name = "mosaic-analysis"
version = "0.1.0"
description = "Post-recording batch pose/motion analysis for MOSAIC sessions (YOLOv8-pose)"
# py-feat>=2.1.0 (below) itself requires >=3.11 — the floor used to be a
# stale >=3.10, which was the direct cause of `uv sync`/`uv lock` resolver
# conflicts this project hit more than once (had to fall back to manual
# `uv pip install py-feat` instead of a clean sync). No `analysis/uv.lock`
# existed until this floor was fixed to match reality.
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    # >=8.0 covers the YOLOv8-pose models; the Pose plugin's depth-estimation
    # option (yolo26n/s/m-depth.pt, see analysis/pose/depth_estimator.py)
    # needs a recent-enough release to ship the "depth" task at all — a
    # fresh `uv sync` already resolves to the latest release, so this is
    # just a note, not a version bump.
    "ultralytics>=8.0",
    "mediapipe>=0.10.14",
    "pandas>=2.0",
    "scipy>=1.11",
    "h5py>=3.9",
    "matplotlib>=3.7",
    "faster-whisper>=1.0",
    "pyannote.audio>=3.1",
    "onnxruntime>=1.17",
    "py-feat>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

# onnxruntime (FER+ facial-expression backend) is deliberately the plain CPU
# package, not onnxruntime-gpu — the emotion-ferplus model is a tiny 64x64
# grayscale-input CNN, fast enough on CPU that a GPU variant isn't worth the
# extra CUDA-wheel complexity already noted below for the torch-based deps.
#
# py-feat (3rd facial-expression backend, Detectorv1) pulls in torch/
# torchvision (already present transitively via ultralytics/pyannote.audio,
# so not a new *class* of dependency) plus torchcodec, which is imported
# unconditionally at `import feat` time and needs a torchcodec-compatible
# system FFmpeg discoverable on PATH at runtime — unrelated to and separate
# from this project's own vcpkg-managed C++-side FFmpeg. If the pyfeat
# backend fails to construct, check `where ffmpeg` first; the failure
# surfaces as an FFmpeg-discovery RuntimeError from torchcodec, not a plain
# ImportError. py-feat also caches its downloaded model weights into its
# own installed package directory (site-packages/feat/resources) rather
# than a project-local models/ dir — unlike the other 2 expression
# backends, there is nothing to add to .gitignore for this one, and the
# cache location cannot be redirected via HF_HOME/HUGGINGFACE_HUB_CACHE
# (py-feat hardcodes its own cache_dir on every download).
#
# GPU acceleration (NVIDIA only): ultralytics, faster-whisper (via ctranslate2),
# and pyannote.audio (via torch/torchaudio) all pull in CPU-only wheels from
# PyPI by default. A manual `uv pip install torch --index-url ...` does NOT
# survive the next `uv sync` — it reconciles the environment back to the CPU
# wheels pinned in uv.lock. To make CUDA wheels stick for the torch-based
# packages (ultralytics, pyannote.audio), uncomment and adjust the CUDA
# version below (see https://docs.astral.sh/uv/guides/integration/pytorch/).
# faster-whisper's ctranslate2 backend detects CUDA independently of torch —
# see https://opennmt.net/CTranslate2/installation.html for its own GPU
# requirements (CUDA 12.x + cuDNN 9):
#
# [[tool.uv.index]]
# name = "pytorch-cu121"
# url = "https://download.pytorch.org/whl/cu121"
# explicit = true
#
# [tool.uv.sources]
# torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
# torchvision = [{ index = "pytorch-cu121", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
