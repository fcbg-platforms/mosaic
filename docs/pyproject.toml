[project]
name = "mosaic-docs"
version = "0.1.0"
description = "Sphinx documentation build for MOSAIC"
requires-python = ">=3.10"
dependencies = [
    "sphinx>=7.2",
    "pydata-sphinx-theme>=0.15",
    "breathe>=4.35",
    "exhale>=0.3.7",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
    # For autodoc's rendered numpy.ndarray type hints across analysis/'s
    # public API — small/CPU-only, deliberately NOT mocked (see conf.py's
    # autodoc_mock_imports comment).
    "numpy>=1.26",
]

[tool.uv]
package = false
