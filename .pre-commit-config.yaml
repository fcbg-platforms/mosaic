repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--config, ruff.toml, --fix]
        files: ^(python|analysis|docs)/.*\.py$
      - id: ruff-format
        args: [--config, ruff.toml]
        files: ^(python|analysis|docs)/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: ^(src|tests)/.*\.(cpp|hpp)$
