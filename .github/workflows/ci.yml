name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# NOTE: this builds only the hardware-free configuration
# (MOSAIC_ENABLE_CAMERAS=OFF, MOSAIC_ENABLE_FFMPEG=OFF, MOSAIC_ENABLE_LSL=OFF).
# Basler Pylon is a licensed vendor SDK (not fetchable via vcpkg) and
# camera/LSL hardware isn't available on hosted runners, so those flags
# can't be exercised here — only local/lab builds cover that surface.
jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtmultimedia qtserialport qtcharts'
          cache: true

      - name: Setup vcpkg (with binary caching)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DMOSAIC_BUILD_TESTS=ON
          -DMOSAIC_ENABLE_CAMERAS=OFF
          -DMOSAIC_ENABLE_FFMPEG=OFF
          -DMOSAIC_ENABLE_LSL=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
