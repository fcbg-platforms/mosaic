name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# NOTE: this builds only the hardware-free configuration
# (MOSAIC_ENABLE_CAMERAS=OFF, MOSAIC_ENABLE_FFMPEG=OFF).
# Basler Pylon is a licensed vendor SDK (not fetchable via vcpkg) and
# camera hardware isn't available on hosted runners, so that flag
# can't be exercised here — only local/lab builds cover that surface.
jobs:
  lint-python:
    runs-on: ubuntu-latest

    # ruff.toml/pre-commit already declared this policy; nothing enforced it
    # anywhere until now. No Qt/vcpkg/uv-sync needed — ruff only needs its
    # own binary and the source tree.
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        # Pinned to match .pre-commit-config.yaml's `rev: v0.8.4` so local
        # pre-commit and CI never disagree on findings.
        run: pip install ruff==0.8.4

      - name: ruff check
        run: ruff check --config ruff.toml .

      - name: ruff format --check
        run: ruff format --config ruff.toml --check .

  lint-cpp:
    runs-on: ubuntu-latest

    # clang-format needs no Qt/MSVC/vcpkg context at all, so this runs on
    # the lighter/faster Linux runner rather than windows-latest.
    #
    # Scoped to files changed since diverging from main — git's own
    # standard pattern for enforcing a formatter on an existing codebase
    # (cf. `git clang-format`) — rather than the whole src/+tests/ tree.
    # The entire tree was brought into one-time compliance in the PR that
    # introduced this job; this check only guards against new drift from
    # here on, so a future .clang-format tweak can't retroactively fail
    # untouched files, and CI stays fast.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        # Pinned to match .pre-commit-config.yaml's `rev: v18.1.8` (same
        # rationale as lint-python's ruff pin above) — plain `apt-get install
        # clang-format` resolves to whatever Ubuntu's repo currently ships
        # (an experimental pre-release snapshot at the time this was added,
        # e.g. 18.0-59~exp2), which can disagree with the pinned stable
        # release on edge-case formatting decisions even at the "same"
        # major version, producing false-positive CI failures on code that
        # local pre-commit / a real 18.1.8 binary already considers clean.
        # pipx (not plain pip) because ubuntu-latest's system Python is
        # PEP 668 "externally managed" — pipx is the pre-installed,
        # sandboxed way to get a CLI tool onto PATH on GitHub's hosted
        # Ubuntu runners without a venv or --break-system-packages.
        run: pipx install clang-format==18.1.8

      - name: Determine merge-base with main
        id: base
        run: |
          git fetch origin main --quiet
          echo "sha=$(git merge-base origin/main HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check formatting of changed files only
        run: |
          files=$(git diff --name-only ${{ steps.base.outputs.sha }} -- src tests | grep -E '\.(cpp|hpp)$' || true)
          if [ -z "$files" ]; then
            echo "No changed C++ files."
            exit 0
          fi
          echo "Checking:"
          echo "$files"
          clang-format --dry-run --Werror $files

  clang-tidy:
    runs-on: windows-latest

    # .clang-tidy is configured (cppcoreguidelines-*/modernize-*/readability-*/
    # performance-*/clang-analyzer-*) but had never been run once against this
    # ~150-file codebase before this job existed. Advisory only for now (see
    # .clang-tidy's own WarningsAsErrors: "") — reports findings in the job
    # summary but never fails the check, pending a first triage pass; diff-
    # scoped to changed .cpp files, mirroring lint-cpp's own "only new drift,
    # not the whole untriaged tree" convention.
    #
    # Needs its own separate build from build-and-test: clang-tidy needs a
    # real compile_commands.json, and CMAKE_EXPORT_COMPILE_COMMANDS is
    # silently ignored by the multi-config Visual Studio generator
    # build-and-test uses (a documented CMake limitation for multi-config
    # generators, not a bug here) — so this job configures with -G Ninja and
    # the real MSVC cl.exe instead of switching generators for everyone.
    # clang-tidy auto-detects "cl"/"cl.exe" as the compiler driver in
    # compile_commands.json and parses MSVC-style flags correctly on its
    # own, so no separate clang-cl toolchain is needed.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine merge-base with main
        id: base
        shell: bash
        run: |
          git fetch origin main --quiet
          echo "sha=$(git merge-base origin/main HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check for changed C++ files
        id: changed
        shell: bash
        run: |
          files=$(git diff --name-only ${{ steps.base.outputs.sha }} -- src tests | grep -E '\.(cpp|hpp)$' || true)
          if [ -z "$files" ]; then
            echo "No changed C++ files — skipping clang-tidy entirely."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_files=true" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          echo "$files"
          # Only .cpp files are handed to clang-tidy directly — it analyzes
          # translation units, matched 1:1 against compile_commands.json
          # entries. A .hpp's own issues still surface via HeaderFilterRegex
          # when a .cpp that includes it is checked; a diff touching *only*
          # a header with no .cpp in the same diff isn't directly
          # re-checked this round — a known, accepted limitation for a
          # first pass, not an oversight.
          cpp_files=$(echo "$files" | grep -E '\.cpp$' || true)
          {
            echo "cpp_files<<TIDY_EOF"
            echo "$cpp_files"
            echo "TIDY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup MSVC dev environment
        if: steps.changed.outputs.has_files == 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        if: steps.changed.outputs.has_files == 'true'
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Qt
        if: steps.changed.outputs.has_files == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtmultimedia qtserialport qtcharts'
          cache: true

      - name: Setup vcpkg (with binary caching)
        if: steps.changed.outputs.has_files == 'true'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure (Ninja + cl.exe, for compile_commands.json)
        if: steps.changed.outputs.has_files == 'true'
        shell: pwsh
        # CMAKE_BUILD_TYPE=Release is required here even though build-and-
        # test's own multi-config VS-generator build never sets it — Ninja
        # is a single-config generator, so without an explicit build type
        # vcpkg's toolchain silently links the Debug-variant vcpkg libs
        # (verified directly: an unset CMAKE_BUILD_TYPE here linked
        # opencv_calib3d4d.lib/opencv_objdetect4d.lib from
        # vcpkg_installed/x64-windows/debug/lib against Release-ish compile
        # flags, producing dozens of LNK2019 unresolved externals for
        # cv::calibrateCamera/cv::aruco::* — a real, silent trap for any
        # single-config Ninja build of this project, not clang-tidy-specific).
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DMOSAIC_BUILD_TESTS=ON
          -DMOSAIC_ENABLE_CAMERAS=OFF
          -DMOSAIC_ENABLE_FFMPEG=OFF

      - name: Build (produces generated Qt moc/ui sources too)
        if: steps.changed.outputs.has_files == 'true'
        run: cmake --build build --parallel

      - name: Install clang-tidy
        if: steps.changed.outputs.has_files == 'true'
        # NOT pinned to the same 18.1.8 as .clang-format/pre-commit's
        # clang-tidy mirror would suggest — verified directly (this exact
        # combination was smoke-tested locally before landing) that 18.1.8's
        # bundled Clang frontend fails a hard compile error against this
        # toolset's MSVC STL: `yvals_core.h` static_asserts on
        # `_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH`-gated versions,
        # requiring Clang >=19 for MSVC 19.44's STL. 19.1.0.1 is the oldest
        # pip-published clang-tidy release that clears that gate.
        run: pip install clang-tidy==19.1.0.1

      - name: Run clang-tidy on changed files (advisory only)
        if: steps.changed.outputs.has_files == 'true'
        shell: bash
        run: |
          files="${{ steps.changed.outputs.cpp_files }}"
          {
            echo "## clang-tidy results"
            echo ""
            echo "Advisory only (see \`.clang-tidy\`'s \`WarningsAsErrors: \"\"\`) — never fails this job."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$files" ]; then
            echo "_Changed files were header-only — nothing to run clang-tidy on directly this round._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Checking:"
          echo "$files"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          clang-tidy -p build $files 2>&1 | tee clang-tidy-report.txt | tail -c 60000 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          warnings=$(grep -c "warning:" clang-tidy-report.txt || true)
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total warnings: ${warnings:-0}**" >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # AnalysisManagerTest launches a small, freshly-built, unsigned helper
      # exe (tests/analysis_stub) via QProcess -- on windows-latest specifically
      # (never reproduced locally), QProcess::waitForStarted() for that exact
      # binary fails near-instantly on every attempt, consistent with Windows
      # Defender's real-time scanner blocking/quarantining a brand-new,
      # unsigned executable with generic "read env vars, exit with a
      # caller-chosen code" behavior before it's ever allowed to run. This is
      # a well-known class of GitHub-hosted Windows runner flakiness for
      # freshly-compiled native test doubles -- excluding the build output
      # directory from scanning is the standard mitigation.
      - name: Exclude build directory from Windows Defender scanning
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}\build"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtmultimedia qtserialport qtcharts'
          cache: true

      - name: Setup vcpkg (with binary caching)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DMOSAIC_BUILD_TESTS=ON
          -DMOSAIC_ENABLE_CAMERAS=OFF
          -DMOSAIC_ENABLE_FFMPEG=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

  docs:
    runs-on: ubuntu-latest

    # Bypasses CMake entirely: CMakeLists.txt calls find_package(Qt6 ...)
    # unconditionally, before MOSAIC_BUILD_DOCS is even read, so a
    # CMake-driven docs build would still need the full Qt6+vcpkg toolchain.
    # Standalone Doxygen + sphinx-build needs none of that.
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install docs dependencies
        working-directory: docs
        run: uv sync

      - name: Render Doxyfile.in and run Doxygen
        run: |
          sed \
            -e "s|@PROJECT_VERSION@|0.0.0-ci|g" \
            -e "s|@CMAKE_SOURCE_DIR@|${{ github.workspace }}|g" \
            -e "s|@CMAKE_CURRENT_BINARY_DIR@|${{ github.workspace }}/build-docs|g" \
            docs/Doxyfile.in > build-docs.Doxyfile
          mkdir -p build-docs
          doxygen build-docs.Doxyfile

      - name: Build Sphinx docs
        working-directory: docs
        env:
          DOXYGEN_XML: ${{ github.workspace }}/build-docs/doxygen/xml
        # --keep-going: start permissive to baseline pre-existing warnings
        # before tightening to a hard -W once confirmed clean.
        run: uv run sphinx-build -b html --keep-going . _build/html

      - name: Upload built docs (build-time artifact, not the Pages one yet)
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

  # Separate job (not just conditional steps inside `docs`) so a PR run of
  # `docs` never touches the github-pages environment at all: that
  # environment has a branch-protection rule limiting deployments to main,
  # and a job-level `if: false` skips the job before any environment check
  # happens — whereas gating individual steps inside `docs` still evaluates
  # the job's `environment:` up front for EVERY trigger (including PRs),
  # which GitHub rejects outright for a non-main branch before running any
  # step at all. Found this the hard way: PR #11's `docs` job failed in 2s
  # with zero steps executed once `environment: github-pages` was added
  # directly to it.
  docs-deploy:
    needs: docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages:    write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Download built docs
        uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: docs-html

      - name: Upload docs as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
