[project]
name = "mosaic-pose"
version = "0.1.0"
description = "Real-time pose/gaze estimation worker used live during MOSAIC recording"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.14",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
]

[project.scripts]
mosaic-pose = "pose.frame_server:main"
